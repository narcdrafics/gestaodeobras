<div class="page-header">
  <div class="page-title">Relatório <small id="hoje-data"></small></div>
  <div class="btn-group" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
    <button class="btn btn-secondary btn-sm" onclick="changeHojeDate(-1)" title="Dia anterior">◀</button>
    <input type="date" id="hoje-date-picker" class="form-control" style="width:140px; padding:4px 8px; font-size:13px;" onchange="renderHoje(this.value)">
    <button class="btn btn-secondary btn-sm" onclick="setHojeToday()" title="Ir para hoje" style="font-weight:600;">Hoje</button>
    <button class="btn btn-secondary btn-sm" onclick="changeHojeDate(1)" title="Próximo dia">▶</button>
    <button class="btn btn-secondary btn-sm" onclick="renderHoje(document.getElementById('hoje-date-picker').value)">🔄 Atualizar</button>
    <button class="btn btn-primary btn-sm" onclick="exportHoje()">📤 Exportar</button>
  </div>
</div>

<div class="kpi-grid" id="kpi-grid"></div>

<div class="section-title">⚠️ Pendências do Dia</div>
<div class="alerts-grid" id="alerts-grid"></div>

<div class="section-title" style="margin-top:8px">👷 Presença por Obra</div>
<div class="table-wrap">
  <table>
    <thead><tr><th>Obra</th><th>Present</th><th>Faltas</th><th>Total</th><th>Valor Diárias</th></tr></thead>
    <tbody id="hoje-obras-tbody"></tbody>
  </table>
</div>

<div class="section-title" style="margin-top:8px">👷 Presença por Funcionário</div>
<div class="table-wrap">
  <table>
    <thead><tr><th>Funcionário</th><th>Função</th><th>Obra</th><th>Status</th><th>Horas</th><th>Valor</th></tr></thead>
    <tbody id="hoje-funcionarios-tbody"></tbody>
  </table>
</div>

<div class="section-title" style="margin-top:8px">📋 Medições Pendentes</div>
<div class="table-wrap">
  <table>
    <thead><tr><th>Tipo</th><th>Descrição</th><th>Obra</th><th>Valor Pendente</th><th>Status</th></tr></thead>
    <tbody id="hoje-medicoes-tbody"></tbody>
  </table>
</div>

<div class="section-title" style="margin-top:8px">💰 Pagamentos Pendentes</div>
<div class="table-wrap">
  <table>
    <thead><tr><th>Tipo</th><th>Descrição</th><th>Obra</th><th>Valor</th><th>Status</th></tr></thead>
    <tbody id="hoje-pendentes-tbody"></tbody>
  </table>
</div>
