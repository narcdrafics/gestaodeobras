<div class="page-header">
  <div class="page-title">Tarefas <small>Checklist de Obra</small></div>
  <button class="btn btn-primary" onclick="openModal('modal-tarefa')">+ Nova Tarefa</button>
</div>
<div class="kpi-grid" id="tar-kpi"></div>
<div class="table-wrap">
  <div class="table-toolbar tarefas-toolbar" style="flex-wrap:wrap;gap:16px;">
    <div style="display:flex;align-items:center;gap:16px">
      <h3 style="margin:0">Controle de Tarefas</h3>
      <div class="view-toggle">
        <button id="btn-view-table" class="view-btn active" onclick="setTaskView('table')"><span class="material-symbols-outlined md-16" style="vertical-align:middle;margin-right:4px;">bar_chart</span> Tabela</button>
        <button id="id-view-kanban" class="view-btn" onclick="setTaskView('kanban')"><span class="material-symbols-outlined md-16" style="vertical-align:middle;margin-right:4px;">checklist</span> Quadro</button>
      </div>
    </div>
    <div class="toolbar-right tarefas-filtros" style="display:flex;gap:10px;flex:1;justify-content:flex-end;flex-wrap:wrap;align-items:center">
      <input class="search-input" id="tar-busca" placeholder="Buscar tarefa..." oninput="onTaskSearch()" style="max-width:190px">
      <select id="tar-obra-filter" class="form-control" style="width:150px" onchange="renderTarefas()">
        <option value="">Todas obras</option>
      </select>
      <select id="tar-status-filter" class="form-control" style="width:145px" onchange="renderTarefas()">
        <option value="">Todos status</option>
        <option value="abertas">Abertas</option>
        <option value="atrasadas">Atrasadas</option>
        <option value="A fazer">A fazer</option>
        <option value="Em andamento">Em andamento</option>
        <option value="Concluída">Concluída</option>
        <option value="Pausada">Pausada</option>
      </select>
      <select id="tar-prio-filter" class="form-control" style="width:130px" onchange="renderTarefas()">
        <option value="">Todas prioridades</option>
        <option value="Alta">Alta</option>
        <option value="Média">Média</option>
        <option value="Baixa">Baixa</option>
      </select>
      <select id="tar-resp-filter" class="form-control" style="width:160px" onchange="renderTarefas()">
        <option value="">Todos responsáveis</option>
      </select>
      <select id="tar-ordem" class="form-control" style="width:150px" onchange="renderTarefas()">
        <option value="prazo">Ordenar: prazo</option>
        <option value="prioridade">Ordenar: prioridade</option>
        <option value="status">Ordenar: status</option>
        <option value="recentes">Ordenar: recentes</option>
      </select>
      <label class="tarefas-check" title="Mostrar apenas tarefas com prazo vencido">
        <input type="checkbox" id="tar-vencidas" onchange="renderTarefas()"> Vencidas
      </label>
      <label class="tarefas-check" title="Mostrar apenas tarefas atribuídas a mim">
        <input type="checkbox" id="tar-minhas" onchange="renderTarefas()"> Minhas
      </label>
      <button class="btn btn-secondary btn-sm" onclick="limparFiltrosTarefas()" title="Limpar todos os filtros">Limpar filtros</button>
    </div>
  </div>
  
  <div id="tar-table-container">
    <div class="table-responsive">
      <table>
        <thead><tr><th>Cód.</th><th>Obra</th><th>Etapa / Frente</th><th>Descrição</th><th>Responsável</th><th>Prior.</th><th>Status</th><th>Prazo</th><th>% Conc.</th><th>Ações</th></tr></thead>
        <tbody id="tar-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="tar-kanban-container" style="display:none; padding:16px; background:var(--bg3); border-radius:0 0 12px 12px">
    <div id="tar-board" class="kanban-board"></div>
  </div>
</div>
