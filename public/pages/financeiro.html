<div class="page-header" style="flex-wrap:wrap;gap:12px; align-items: flex-end;">
  <div class="page-title">Financeiro <small id="fin-period-subtitle">Fluxo Mensal</small></div>

  <div class="fin-controls" style="display:flex; flex-wrap:wrap; gap:8px; align-items: center;">
    <div class="form-group" style="margin:0;">
      <select id="fin-view-type" class="form-control" style="padding:6px 12px; height:38px; min-width:160px;" onchange="toggleFinCustomDates()">
        <option value="mes">Este Mês</option>
        <option value="custom">Personalizado</option>
      </select>
    </div>
    <div id="fin-custom-dates" style="display:none; gap:8px; align-items:center;">
      <input type="date" id="fin-data-ini" class="form-control" style="padding:6px 10px; height:38px;">
      <span style="color:var(--text3)">até</span>
      <input type="date" id="fin-data-fim" class="form-control" style="padding:6px 10px; height:38px;">
      <button class="btn btn-primary btn-sm" onclick="applyFinCustomPeriod()">Aplicar</button>
    </div>
    <div class="form-group fin-standard-dates" style="margin:0;">
      <select id="fin-month" class="form-control" style="padding:6px 12px; height:38px; min-width:110px;" onchange="renderFinanceiro()">
        <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option>
        <option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option>
        <option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option>
        <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
      </select>
    </div>
    <div class="form-group fin-standard-dates" style="margin:0;">
      <select id="fin-year" class="form-control" style="padding:6px 12px; height:38px; min-width:80px;" onchange="renderFinanceiro()"></select>
    </div>
  </div>

  <div style="margin-left:auto; display:flex; gap:8px;">
    <button class="btn btn-secondary" data-feature="pix.folha" style="border-color:var(--green);color:var(--green);font-weight:600;" onclick="prepareLotePgto()"><span class="material-symbols-outlined md-16" style="vertical-align:middle;margin-right:4px;">payments</span> Fechar Folha</button>
    <button class="btn btn-primary" onclick="openModal('modal-financeiro')">+ Novo Lançamento</button>
  </div>
</div>

<!-- KPIs clicáveis -->
<div class="fin-kpi-grid" id="fin-kpis"></div>

<!-- Abas por categoria -->
<div class="fin-tabs" id="fin-tabs"></div>

<!-- Barra de ações em lote -->
<div id="fin-bulk-bar" class="fin-bulk-bar" style="display:none"></div>

<!-- Tabela única -->
<div class="table-wrap">
  <div class="table-toolbar" style="flex-wrap:wrap;gap:8px;">
    <h3 style="margin:0"><span class="material-symbols-outlined md-18" style="vertical-align:middle;margin-right:6px;">account_balance_wallet</span> Lançamentos Financeiros</h3>
    <div class="toolbar-right" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
      <div class="fin-seg" role="group" aria-label="Agrupar por">
        <button type="button" id="fin-group-tipo" class="active" onclick="setFinGroup('tipo')">Por tipo</button>
        <button type="button" id="fin-group-obra" onclick="setFinGroup('obra')">Por obra</button>
      </div>
      <input class="search-input" id="fin-busca" placeholder="Obra, descrição, beneficiário..." style="min-width:200px" oninput="filterFinanceiro()">
      <select id="fin-status-filter" class="form-control" style="width:auto;padding:6px 10px;border-radius:6px;font-size:13px" onchange="filterFinanceiro()">
        <option value="">Todos os status</option>
        <option value="pago">Pago</option>
        <option value="a-pagar">A pagar</option>
        <option value="parcial">Parcial</option>
        <option value="atrasado">Atrasado</option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);white-space:nowrap;">
        Exibir
        <select id="fin-page-size" class="form-control" style="width:auto;padding:6px 8px;border-radius:6px;font-size:13px" onchange="setFinPageSize(this.value)">
          <option value="25">25 linhas</option>
          <option value="50">50 linhas</option>
          <option value="100">100 linhas</option>
          <option value="0">Todas</option>
        </select>
      </label>
    </div>
  </div>
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th style="min-width:110px">Data</th>
          <th>Obra</th>
          <th>Descrição</th>
          <th>Beneficiário</th>
          <th style="text-align:right">Valor</th>
          <th>Status</th>
          <th style="width:70px;text-align:center">Ações</th>
        </tr>
      </thead>
      <tbody id="fin-tbody"></tbody>
      <tfoot id="fin-tfoot"></tfoot>
    </table>
  </div>
  <div class="fin-pagination" id="fin-pagination"></div>
</div>

<style>
.fin-kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:10px; margin-bottom:14px; }
.fin-kpi { cursor:pointer; transition:border-color .15s, box-shadow .15s, transform .15s; border-left:3px solid transparent; }
.fin-kpi:hover { border-color:var(--text2); transform:translateY(-1px); }
.fin-kpi.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.fin-kpi .kpi-label { display:flex; align-items:center; gap:4px; }
.fin-kpi .kpi-val { font-size:20px; letter-spacing:-0.5px; }
.fin-kpi .kpi-sub { font-size:11px; color:var(--text3); }
.fin-kpi-danger.active { border-color:var(--orange); }
.fin-kpi-danger .kpi-val { color:var(--orange); }
.fin-kpi-success .kpi-val { color:var(--green); }

.fin-tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:14px; overflow-x:auto; }
.fin-tab { padding:10px 14px; cursor:pointer; font-size:13px; font-weight:600; color:var(--text3); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; background:none; border-top:none; border-left:none; border-right:none; }
.fin-tab:hover { color:var(--text); }
.fin-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.fin-tab .count { display:inline-block; min-width:18px; padding:1px 6px; margin-left:5px; border-radius:10px; background:var(--bg3); color:var(--text2); font-size:11px; text-align:center; }
.fin-tab.active .count { background:var(--accent); color:var(--accent-text); }

.fin-bulk-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; margin-bottom:12px; background:var(--bg2); border:1px solid var(--accent); border-radius:8px; font-size:13px; }
.fin-bulk-bar .fin-bulk-total { font-weight:700; color:var(--orange); }

.fin-seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.fin-seg button { background:var(--bg); color:var(--text3); border:none; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; }
.fin-seg button.active { background:var(--accent); color:var(--accent-text); }

.fin-row td { vertical-align:top; }
.fin-check { transform:scale(1.15); margin-right:6px; cursor:pointer; }
.fin-group-row td { background:var(--bg3); font-weight:700; padding:10px 14px; border-top:2px solid var(--border); }
.fin-group-row .fin-group-label { display:flex; align-items:center; gap:8px; }
.fin-group-row .fin-group-total { margin-left:auto; font-family:var(--font-mono, monospace); font-variant-numeric: tabular-nums; color:var(--text2); }
.fin-group-toggle { background:none; border:none; color:var(--text3); cursor:pointer; font-size:12px; padding:2px 4px; }
.fin-child-row td { background:var(--bg); border-left:2px solid var(--accent); font-size:13px; }
.fin-child-row td:first-child { padding-left:34px; }
.fin-detail-row td { background:var(--bg); padding:10px 16px; }
.fin-detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px 16px; font-size:12px; color:var(--text2); }
.fin-detail-grid b { color:var(--text); display:block; font-size:13px; margin-top:2px; }

.fin-actions { position:relative; display:inline-block; }
.fin-actions summary { list-style:none; cursor:pointer; padding:2px 8px; border-radius:6px; font-size:18px; line-height:1; color:var(--text2); border:1px solid transparent; }
.fin-actions summary::-webkit-details-marker { display:none; }
.fin-actions summary:hover { background:var(--bg3); color:var(--text); }
.fin-actions[open] summary { background:var(--bg3); border-color:var(--border); }
.fin-actions-menu { position:absolute; right:0; top:120%; z-index:30; min-width:170px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.25); padding:4px; }
.fin-actions-menu button { display:block; width:100%; text-align:left; background:none; border:none; color:var(--text); padding:8px 10px; border-radius:5px; font-size:13px; cursor:pointer; }
.fin-actions-menu button:hover { background:var(--bg3); }
.fin-actions-menu button.danger { color:var(--red); }

.fin-pagination { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 14px; border-top:1px solid var(--border); font-size:12px; color:var(--text3); }
.fin-pagination .fin-page-buttons { display:flex; gap:6px; align-items:center; }

.fin-tag { font-size:10px; opacity:.75; margin-left:4px; }

@media (max-width: 767px) {
  .page-header { flex-direction: column; align-items: flex-start; }
  .toolbar-right { width: 100%; }
  .toolbar-right .search-input,
  .toolbar-right .form-control { width: 100% !important; }
  .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .fin-kpi-grid { grid-template-columns: 1fr 1fr; }
  .fin-actions-menu { position:fixed; right:16px; top:auto; bottom:24px; min-width:200px; }
}
</style>
