<div class="page-header" style="flex-wrap: wrap; gap: 12px;">
  <div class="page-title">Dashboard Executivo <small>Visão geral em tempo real</small></div>
  <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
    <div id="dash-updated" style="font-size:12px;color:var(--text3); margin-right: 8px;"></div>
    <div id="dash-actions" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    <button class="btn btn-secondary btn-sm" onclick="exportarImagemDashboard()">📸 WhatsApp (Img)</button>
    <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ PDF / Imprimir</button>
    <details class="dash-more">
      <summary class="btn btn-secondary btn-sm">⋯ Mais</summary>
      <div class="dash-more-menu">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('import-file').click()">📥 Importar</button>
        <button class="btn btn-secondary btn-sm" onclick="exportarBackup()">💾 Exportar Banco</button>
      </div>
      <input type="file" id="import-file" style="display:none" accept=".json" onchange="importarBackup(event)">
    </details>
  </div>
</div>
<div class="kpi-grid" id="kpi-grid"></div>
<div class="section-title">⚠️ Alertas do Dia</div>
<div class="alerts-grid" id="alerts-grid"></div>
<div class="section-title" style="margin-top:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
  <span>📊 Resumo por Obra</span>
  <label style="font-size:12px; font-weight:400; color:var(--text3); cursor:pointer;">
    <input type="checkbox" id="dash-show-done" onchange="renderDashboard()"> Mostrar concluídas <span id="dash-done-count"></span>
  </label>
</div>
<div class="table-wrap">
  <table>
    <thead><tr>
      <th>Obra</th><th>Status</th><th>Mestre</th>
      <th title="Orçamento previsto da obra">Orç. Prev.</th>
      <th title="Dias de trabalho pagos de segunda-feira até hoje">Diárias (Sem.)</th>
      <th title="Mão de obra + empreitadas + lançamentos financeiros, de segunda-feira até hoje">Custo Sem.</th>
      <th title="Mão de obra + empreitadas + lançamentos financeiros, do dia 1 até hoje">Custo Mês</th>
      <th title="Soma de todos os custos da obra desde o início: mão de obra + empreitadas + lançamentos financeiros">Total Real.</th>
      <th title="Total real dividido pelo orçamento previsto">% Custo</th>
      <th>Tarefas</th>
    </tr></thead>
    <tbody id="dash-obras-tbody"></tbody>
  </table>
</div>
