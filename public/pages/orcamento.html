<div class="page-header">
  <div class="page-title">Orçamento <small>Contrato de serviços: previsto, medido e pago</small></div>
  <button class="btn btn-primary" onclick="openModal('modal-orcamento')">+ Novo Serviço</button>
</div>
<div class="table-wrap">
  <div class="table-toolbar">
    <h3>Serviços contratados</h3>
    <div class="toolbar-right">
      <select class="form-control orc-filter-obra" id="orc-filtro-obra" onchange="renderOrcamento()" aria-label="Filtrar por obra"></select>
      <input class="search-input" id="orc-busca" placeholder="Buscar serviço, etapa, empreiteiro..." oninput="filterOrcamento()">
    </div>
  </div>
  <div class="table-responsive">
    <table>
      <thead><tr>
        <th>Etapa / Subetapa</th>
        <th>Serviço</th>
        <th>Empreiteiro</th>
        <th>Unid.</th>
        <th class="num">Qtd. Prev.</th>
        <th class="num">Vl. Unit.</th>
        <th class="num">Previsto</th>
        <th class="num">Medido</th>
        <th class="num">Pago</th>
        <th class="num">A pagar</th>
        <th>% exec.</th>
        <th>Ações</th>
      </tr></thead>
      <tbody id="orc-tbody"></tbody>
    </table>
  </div>
</div>
