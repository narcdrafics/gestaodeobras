<div class="page-header">
  <div class="page-title">Medição <small>Produção física do canteiro e controle financeiro na mesma tabela</small></div>
  <div class="page-actions">
    <button class="btn btn-secondary" onclick="window.print()">Imprimir</button>
    <button class="btn btn-primary" onclick="openModal('modal-medicao')">+ Nova Medição</button>
  </div>
</div>

<div class="med-filters">
  <div class="med-filter-grid">
    <div class="form-group">
      <label class="form-label">Obra *</label>
      <select class="form-control" id="med-filter-obra" onchange="renderMedicao()"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Etapa</label>
      <select class="form-control" id="med-filter-etapa" onchange="renderMedicao()"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Aprovação</label>
      <select class="form-control" id="med-filter-aprovacao" onchange="renderMedicao()">
        <option value="">Todas</option>
        <option value="Pendente">Pendente</option>
        <option value="Aprovada">Aprovada</option>
        <option value="Rejeitada">Rejeitada</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">De</label>
      <input type="date" class="form-control" id="med-filter-ini" onchange="renderMedicao()">
    </div>
    <div class="form-group">
      <label class="form-label">Até</label>
      <input type="date" class="form-control" id="med-filter-fim" onchange="renderMedicao()">
    </div>
  </div>
</div>

<div class="med-kpis" id="med-kpis"></div>

<div class="card med-panel">
  <div class="med-panel-head">
    <div>
      <h3 id="med-titulo">Avanço por serviço</h3>
      <p class="med-muted" id="med-descricao">A mesma tabela, duas visões. Aprovação é física; pagamento é financeiro.</p>
    </div>
    <div class="med-panel-tools">
      <span class="med-count" id="med-count"></span>
      <div class="view-toggle" id="med-view-toggle">
        <button type="button" class="view-btn active" data-med-view="canteiro" onclick="setMedicaoView('canteiro')">Canteiro</button>
        <button type="button" class="view-btn" data-med-view="financeiro" onclick="setMedicaoView('financeiro')">Financeiro</button>
      </div>
    </div>
  </div>
  <div class="table-responsive">
    <table>
      <thead id="med-head"></thead>
      <tbody id="med-tbody"></tbody>
    </table>
  </div>
</div>

<div class="card med-history" id="med-historico" style="display:none"></div>
