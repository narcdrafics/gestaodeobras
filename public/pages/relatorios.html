<div class="page-header">
  <div class="page-title">Relatórios e Vistoria <small>Consolidação de dados para auditoria</small></div>
</div>

<div id="rel-filters" class="rel-filters">
  <div class="form-group rel-obra-field">
    <label class="form-label">Obra para auditoria</label>
    <select class="form-control" id="rel-obra" onchange="checkRelObra()"></select>
    <small id="rel-obra-info" class="rel-hint"></small>
  </div>
  <div class="form-group">
    <label class="form-label">Período — de</label>
    <input type="date" class="form-control" id="rel-data-ini">
  </div>
  <div class="form-group">
    <label class="form-label">Período — até</label>
    <input type="date" class="form-control" id="rel-data-fim">
  </div>
  <div class="form-group">
    <label class="form-label">Responsável</label>
    <input class="form-control" id="rel-responsavel" placeholder="Nome de quem acompanhou">
  </div>
  <div class="form-group">
    <label class="form-label">Nº do relatório</label>
    <input class="form-control" id="rel-numero" placeholder="Gerado automaticamente">
  </div>
  <div class="rel-filter-action">
    <button class="btn btn-primary" onclick="generateAuditReport()">🔍 Gerar Relatório de Vistoria</button>
  </div>
</div>

<div id="rel-preview-area" style="margin-top: 24px;">
  <div class="ui-empty-state">
    <div class="ui-empty-icon">📂</div>
    <div class="ui-empty-title">Pronto para Auditar</div>
    <div class="ui-empty-text">Selecione uma obra e um período para compilar custos, medições, equipe e pendências em um relatório conciliado.</div>
  </div>
</div>
