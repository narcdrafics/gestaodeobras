<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-G67ZEEZ6L3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-G67ZEEZ6L3');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - Obra Real Master</title>

  <link rel="stylesheet" href="css/app.css?v=202603212100">
  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <!-- Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- Firebase Auth -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }

    .login-card {
      background: var(--bg2);
      border: 1px solid var(--accent);
      /* Bordar com a cor de destaque para Admin */
      border-radius: 12px;
      padding: 40px;
      width: 380px;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-brand {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .login-brand span {
      color: var(--accent);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .btn-login {
      width: 100%;
      justify-content: center;
      padding: 12px;
      font-size: 15px;
      margin-top: 8px;
      font-weight: 600;
    }

    .error-msg {
      color: var(--red);
      font-size: 13px;
      background: rgba(239, 68, 68, 0.1);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.2);
      display: none;
      text-align: center;
    }

    .back-to-client {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text3);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-to-client:hover {
      color: var(--accent);
    }

    .admin-auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .admin-tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text3);
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .admin-tab-btn.active {
      color: var(--accent);
      background: rgba(255, 107, 53, 0.1);
    }

    .success-msg {
      color: #22c55e;
      font-size: 13px;
      background: rgba(34, 197, 94, 0.1);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(34, 197, 94, 0.2);
      display: none;
      text-align: center;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <div class="login-brand" style="margin-bottom: 8px;">👑 <span>SaaS Master</span></div>
    <p
      style="color:var(--accent); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:16px;">
      Controle Total da Plataforma</p>

    <!-- Abas Entrar / Primeiro Acesso -->
    <div class="admin-auth-tabs">
      <button type="button" id="tab-login" class="admin-tab-btn active" onclick="switchAdminTab('login')">Entrar</button>
      <button type="button" id="tab-signup" class="admin-tab-btn" onclick="switchAdminTab('signup')">Primeiro Acesso</button>
    </div>

    <div class="login-form">
      <div id="login-error" class="error-msg"></div>
      <div id="login-success" class="success-msg"></div>

      <div class="form-group" style="text-align:left;">
        <label class="form-label" style="font-size:12px;color:var(--text2);margin-bottom:4px;display:block;">E-mail do
          Administrador</label>
        <input type="email" id="auth-email" class="form-control" placeholder="admin@sistema.com"
          style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);box-sizing:border-box;">
      </div>
      <div class="form-group" style="text-align:left; position: relative;">
        <label class="form-label" id="label-pass"
          style="font-size:12px;color:var(--text2);margin-bottom:4px;display:block;">Senha</label>
        <input type="password" id="auth-pass" class="form-control" placeholder="••••••••"
          style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);box-sizing:border-box;">
        <span id="toggle-pass"
          style="position: absolute; right: 10px; bottom: 8px; cursor: pointer; opacity: 0.6; font-size: 14px;"
          onclick="togglePassword()">👁️</span>
      </div>

      <div class="form-group" id="grp-confirm-pass" style="text-align:left; position: relative; display:none;">
        <label class="form-label"
          style="font-size:12px;color:var(--text2);margin-bottom:4px;display:block;">Confirmar Senha</label>
        <input type="password" id="auth-confirm-pass" class="form-control" placeholder="••••••••"
          style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);box-sizing:border-box;">
      </div>

      <div id="forgot-pass-box" style="text-align:right; margin-top:-6px;">
        <a href="#" onclick="doForgotAdminPass(event)" style="font-size:12px; color:var(--accent); text-decoration:none;">Esqueceu a senha?</a>
      </div>

      <button type="button" id="btn-action" class="btn btn-primary btn-login" onclick="handleAdminSubmit()"
        style="margin-top:10px;">Entrar no Painel Master</button>

      <div
        style="margin:15px 0; color:var(--text3); font-size:13px; display:flex; align-items:center; text-align:center;">
        <div style="flex:1;height:1px;background:var(--border);"></div>
        <span style="padding:0 10px;">OU</span>
        <div style="flex:1;height:1px;background:var(--border);"></div>
      </div>

      <button type="button" class="btn btn-primary btn-login" onclick="doGoogleLogin()"
        style="display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#333;border:1px solid #ddd;font-size:15px;padding:12px;margin-top:0;">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px;height:20px"
          alt="G">
        <span>Acessar com Google</span>
      </button>
    </div>

    <a href="login.html" class="back-to-client">← Voltar para login de clientes</a>
  </div>

  <script src="js/data_core.js?v=202603212100"></script>
  <script src="js/auth_core.js?v=202603212100"></script>
  <script>
    let _adminMode = 'login';

    function switchAdminTab(mode) {
      _adminMode = mode;
      hideLoginError();
      hideLoginSuccess();

      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const grpConfirm = document.getElementById('grp-confirm-pass');
      const forgotBox = document.getElementById('forgot-pass-box');
      const btnAction = document.getElementById('btn-action');
      const labelPass = document.getElementById('label-pass');

      if (mode === 'signup') {
        tabLogin.classList.remove('active');
        tabSignup.classList.add('active');
        grpConfirm.style.display = 'block';
        forgotBox.style.display = 'none';
        btnAction.textContent = 'Criar Senha e Acessar';
        labelPass.textContent = 'Nova Senha (mínimo 6 dígitos)';
      } else {
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        grpConfirm.style.display = 'none';
        forgotBox.style.display = 'block';
        btnAction.textContent = 'Entrar no Painel Master';
        labelPass.textContent = 'Senha';
      }
    }

    async function handleAdminSubmit() {
      hideLoginError();
      hideLoginSuccess();

      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-pass').value;

      if (!email || !pass) {
        return showLoginError('Preencha E-mail e Senha.');
      }

      if (_adminMode === 'login') {
        return doEmailLogin();
      }

      // Modo Primeiro Acesso / Criar Senha
      const confirmPass = document.getElementById('auth-confirm-pass').value;
      if (pass.length < 6) {
        return showLoginError('A senha deve ter pelo menos 6 caracteres.');
      }
      if (pass !== confirmPass) {
        return showLoginError('As senhas não conferem. Digite a mesma senha nos dois campos.');
      }

      const btn = document.getElementById('btn-action');
      btn.disabled = true;
      btn.textContent = 'Validando autorização...';

      try {
        const sanitized = email.toLowerCase().replace(/\./g, ',');
        const snap = await firebase.database().ref(`users/${sanitized}`).once('value');
        const userData = snap.val();

        if (!userData || userData.role !== 'super_admin') {
          btn.disabled = false;
          btn.textContent = 'Criar Senha e Acessar';
          return showLoginError('Este e-mail não possui autorização de Super Admin. Solicite acesso ao proprietário do sistema.');
        }

        btn.textContent = 'Criando credencial...';
        firebase.auth().createUserWithEmailAndPassword(email, pass).then((userCredential) => {
          handleAuthSuccess(userCredential.user);
        }).catch(async (err) => {
          btn.disabled = false;
          btn.textContent = 'Criar Senha e Acessar';
          if (err.code === 'auth/email-already-in-use') {
            await firebase.auth().sendPasswordResetEmail(email).catch(() => {});
            showLoginSuccess('Sua conta já existe no Firebase! Um link para redefinir sua senha foi enviado para seu e-mail.');
          } else {
            showLoginError(err.message || 'Falha ao criar credencial.');
          }
        });
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Criar Senha e Acessar';
        showLoginError('Erro ao consultar autorização: ' + (err.message || err));
      }
    }

    async function doForgotAdminPass(e) {
      if (e) e.preventDefault();
      hideLoginError();
      hideLoginSuccess();

      const email = document.getElementById('auth-email').value.trim();
      if (!email) {
        return showLoginError('Digite seu e-mail acima para receber o link de redefinição de senha.');
      }

      try {
        await firebase.auth().sendPasswordResetEmail(email);
        showLoginSuccess(`Link para definir nova senha enviado para ${email}! Verifique sua caixa de entrada.`);
      } catch (err) {
        console.error(err);
        if (err.code === 'auth/user-not-found') {
          showLoginError('E-mail não encontrado no Firebase. Se é seu primeiro acesso, use a aba "Primeiro Acesso" acima.');
        } else {
          showLoginError(err.message || 'Erro ao enviar e-mail de redefinição.');
        }
      }
    }

    function showLoginSuccess(msg) {
      const el = document.getElementById('login-success');
      if (!el) return;
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideLoginSuccess() {
      const el = document.getElementById('login-success');
      if (!el) return;
      el.textContent = '';
      el.style.display = 'none';
    }
    function togglePassword() {
      const input = document.getElementById('auth-pass');
      const toggle = document.getElementById('toggle-pass');
      if (input.type === 'password') {
        input.type = 'text';
        toggle.textContent = '🙈';
      } else {
        input.type = 'password';
        toggle.textContent = '👁️';
      }
    }
  </script>
</body>

</html>
