<input type="hidden" id="oc-edit-idx" value="-1">
<div class="modal-header"><span class="modal-title"><span class="material-symbols-outlined md-18" style="vertical-align:middle;margin-right:6px;">square_foot</span>Novo Serviço de Orçamento</span><button class="modal-close" onclick="closeModal('modal-orcamento')"><span class="material-symbols-outlined md-18">close</span></button></div>
<div class="form-grid">
  <div class="form-group"><label class="form-label">Obra *</label><select class="form-control" id="oc-obra"></select></div>
  <div class="form-group"><label class="form-label">Etapa *</label><input class="form-control" id="oc-etapa" list="oc-etapas-list" placeholder="Revestimento"><datalist id="oc-etapas-list"></datalist></div>
  <div class="form-group"><label class="form-label">Subetapa</label><input class="form-control" id="oc-subetapa" placeholder="Frente Norte"></div>
  <div class="form-group"><label class="form-label">Empreiteiro</label><input class="form-control" id="oc-empreiteiro" placeholder="Empresa ou equipe contratada"></div>
  <div class="form-group"><label class="form-label">Frente de serviço</label><input class="form-control" id="oc-frente" placeholder="Alvenaria externa"></div>
  <div class="form-group"><label class="form-label">Equipe</label><input class="form-control" id="oc-equipe" placeholder="Pedreiros"></div>
  <div class="form-group"><label class="form-label">Tipo Custo</label>
    <select class="form-control" id="oc-tipo"><option>Mão de obra</option><option>Material</option><option>Empreiteiro</option><option>Equipamento</option></select></div>
  <div class="form-group form-full"><label class="form-label">Descrição *</label><input class="form-control" id="oc-desc"></div>
  <div class="form-group"><label class="form-label">Unid.</label><input class="form-control" id="oc-unid" placeholder="m²"></div>
  <div class="form-group"><label class="form-label">Qtd. Prev.</label><input type="number" step="0.01" class="form-control" id="oc-qtd" value="1" oninput="calcOrcTotal()"></div>
  <div class="form-group"><label class="form-label">Vl. Unit. Prev. (R$)</label><input type="number" step="0.01" class="form-control" id="oc-vunit" value="0" oninput="calcOrcTotal()"></div>
  <div class="form-group"><label class="form-label">Vl. Total Prev. (R$)</label><input type="number" class="form-control" id="oc-vtotal" readonly></div>
  <div class="form-group form-full"><label class="form-label">Obs.</label><input class="form-control" id="oc-obs"></div>
</div>
<div class="modal-footer">
  <button class="btn btn-secondary" onclick="closeModal('modal-orcamento')">Cancelar</button>
  <button class="btn btn-primary" onclick="saveOrcamento()">Salvar</button>
</div>
