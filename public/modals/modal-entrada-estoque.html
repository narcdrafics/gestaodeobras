<!-- modals/modal-entrada-estoque.html -->
<div id="modal-entrada-estoque" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-header">
      <h2>📦 Nova Entrada no Estoque</h2>
      <button class="modal-close" onclick="closeModalEntrada()" aria-label="Fechar">×</button>
    </div>
    <div class="form-grid">
      <div class="form-group form-full">
        <label class="form-label">Item <span class="required">*</span></label>
        <select id="ent-item" class="form-control">
          <option value="">Selecione o item...</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Quantidade <span class="required">*</span></label>
        <input type="number" id="ent-quantidade" class="form-control" min="1" value="1">
      </div>
      <div class="form-group">
        <label class="form-label">Valor Unit. (R$)</label>
        <input type="number" step="0.01" id="ent-vunit" class="form-control" value="0">
      </div>
      <div class="form-group form-full">
        <label class="form-label">Motivo / NF / Origem <span class="required">*</span></label>
        <input type="text" id="ent-motivo" class="form-control" placeholder="Ex: Compra NF 1234, Doação, Devolução...">
      </div>
      <div class="form-group form-full">
        <label class="form-label">Observações</label>
        <textarea id="ent-obs" class="form-control" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModalEntrada()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarEntrada()">📦 Registrar Entrada</button>
    </div>
  </div>
</div>
<style>
#modal-entrada-estoque .modal-box { background: var(--bg, #111); border: 1px solid var(--border, #2a2a2a); border-radius: 12px; }
</style>
