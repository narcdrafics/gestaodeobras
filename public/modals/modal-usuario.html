<div class="modal-header"><span class="modal-title"><span class="material-symbols-outlined md-18" style="vertical-align:middle;margin-right:6px;">account_circle</span>Usuário do Sistema</span><button class="modal-close" onclick="closeModal('modal-usuario')"><span class="material-symbols-outlined md-18">close</span></button></div>
<div class="form-grid">
  <div class="form-group"><label class="form-label">E-mail Google Obligatório *</label><input type="email" class="form-control" id="usr-email" placeholder="nome@gmail.com"></div>
  <div class="form-group"><label class="form-label">Nome Completo *</label><input type="text" class="form-control" id="usr-name" placeholder="João Silva"></div>
  <div class="form-group"><label class="form-label">Perfil de Acesso *</label>
    <select class="form-control" id="usr-role" onchange="toggleUsrObras()">
      <option value="admin">Administrador (Total)</option>
      <option value="rh">Recursos Humanos (Personalizável)</option>
      <option value="engenheiro">Engenheiro (Gestão de Obra)</option>
      <option value="encarregado">Encarregado de Obra (Operacional)</option>
      <option value="pendente">Pendente de Aprovação</option>
    </select>
  </div>
  <div class="form-group form-full" id="usr-modulos-wrap" style="display:none">
    <label class="form-label">Módulos liberados para Recursos Humanos</label>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;border:1px solid var(--border);border-radius:8px;padding:10px;">
      <label><input type="checkbox" class="usr-modulo-chk" value="funcionarios" checked> Funcionários</label>
      <label><input type="checkbox" class="usr-modulo-chk" value="presenca" checked> Presença</label>
      <label><input type="checkbox" class="usr-modulo-chk" value="almocos" checked> Almoços</label>
      <label><input type="checkbox" class="usr-modulo-chk" value="tarefas"> Tarefas</label>
      <label><input type="checkbox" class="usr-modulo-chk" value="obras"> Obras</label>
      <label><input type="checkbox" class="usr-modulo-chk" value="medicao"> Medição</label>
      <label><input type="checkbox" class="usr-modulo-chk" value="estoque"> Estoque</label>
      <label><input type="checkbox" class="usr-modulo-chk" value="compras"> Compras</label>
      <label><input type="checkbox" class="usr-modulo-chk" value="financeiro"> Financeiro</label>
      <label><input type="checkbox" class="usr-modulo-chk" value="orcamento"> Orçamento</label>
      <label><input type="checkbox" class="usr-modulo-chk" value="aprovacoes"> Decidir aprovações</label>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:6px">Padrão: funcionários, presença e almoços. Demais módulos só com liberação explícita.</div>
  </div>
  <div class="form-group form-full" id="usr-obras-wrap">
    <label class="form-label">Acesso às Obras</label>
    <select class="form-control" id="usr-obras-modo" onchange="toggleUsrObras()">
      <option value="todas">Todas as obras</option>
      <option value="especificas">Somente as obras designadas</option>
    </select>
    <div id="usr-obras-lista" style="display:none;margin-top:8px;max-height:170px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px;"></div>
  </div>
  <input type="hidden" id="usr-edit-idx" value="-1">
</div>
<div class="modal-footer">
  <button class="btn btn-secondary" onclick="closeModal('modal-usuario')">Cancelar</button>
  <button class="btn btn-primary" onclick="saveUsuario()">Salvar</button>
</div>
