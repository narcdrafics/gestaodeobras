<input type="hidden" id="md-edit-idx" value="-1">
<input type="hidden" id="md-orc-key" value="">

<div class="modal-header">
  <span class="modal-title"><span class="material-symbols-outlined md-18" style="vertical-align:middle;margin-right:6px;">straighten</span>Nova Medição</span>
  <button class="modal-close" onclick="closeModal('modal-medicao')"><span class="material-symbols-outlined md-18">close</span></button>
</div>

<div class="med-form">
  <section class="med-form-section">
    <h4>1. Serviço</h4>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Data da medição *</label>
        <input type="date" class="form-control" id="md-semana">
      </div>
      <div class="form-group">
        <label class="form-label">Obra *</label>
        <select class="form-control" id="md-obra" onchange="onMedicaoObraChange()"></select>
      </div>
      <div class="form-group form-full">
        <label class="form-label">Serviço contratado</label>
        <select class="form-control" id="md-orc-servico" onchange="onMedicaoServicoChange()"></select>
        <small class="med-hint" id="md-orc-hint">Etapa, subetapa, unidade e valores vêm do orçamento.</small>
      </div>
      <div class="form-group form-full" id="md-servico-avulso-grp" style="display:none">
        <label class="form-label">Descrição do serviço avulso</label>
        <input class="form-control" id="md-servico" placeholder="Serviço não cadastrado no orçamento" oninput="updateMedicaoAnterior()">
      </div>
      <div class="form-group form-full" id="md-avulso-dados" style="display:none">
        <div class="med-form-inline">
          <div class="form-group">
            <label class="form-label">Unidade</label>
            <input class="form-control" id="md-unid" placeholder="m²">
          </div>
          <div class="form-group">
            <label class="form-label">Qtd. prevista</label>
            <input type="number" step="0.01" class="form-control" id="md-qprev" oninput="recalcMedicao()">
          </div>
          <div class="form-group">
            <label class="form-label">Valor unitário (R$)</label>
            <input type="number" step="0.01" class="form-control" id="md-vunit" oninput="recalcMedicao()">
          </div>
        </div>
      </div>
    </div>
    <div class="med-inherited" id="md-inherited">
      <div><span>Etapa</span><b id="md-info-etapa">—</b></div>
      <div><span>Subetapa</span><b id="md-info-subetapa">—</b></div>
      <div><span>Empreiteiro / equipe</span><b id="md-info-equipe">—</b></div>
      <div><span>Unidade</span><b id="md-info-unid">—</b></div>
    </div>
  </section>

  <section class="med-form-section">
    <h4>2. Produção do dia</h4>
    <div class="form-grid med-form-grid-4">
      <div class="form-group">
        <label class="form-label">Quantidade do dia *</label>
        <input type="number" step="0.01" class="form-control" id="md-qreal" oninput="recalcMedicao()">
      </div>
      <div class="form-group">
        <label class="form-label">Qtd. anterior</label>
        <input type="number" step="0.01" class="form-control" id="md-qant" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">Qtd. acumulada</label>
        <input type="number" step="0.01" class="form-control" id="md-qacum" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">% executado</label>
        <input class="form-control" id="md-avanco" readonly>
      </div>
    </div>
  </section>

  <section class="med-form-section">
    <h4>3. Evidências</h4>
    <div class="form-grid">
      <div class="form-group form-full">
        <label class="form-label">Fotos (até 6)</label>
        <input type="file" class="form-control" id="md-photos-input" accept="image/*" multiple onchange="handleMedicaoPhotos(this)">
        <small class="md-photo-hint">Cada foto recebe como legenda a descrição do serviço medido.</small>
        <div class="md-photo-grid" id="md-photo-preview" style="display:none"></div>
      </div>
      <div class="form-group form-full">
        <label class="form-label">Observações</label>
        <textarea class="form-control" id="md-obs" rows="3" placeholder="Pendências, ocorrências, local medido..."></textarea>
      </div>
    </div>
  </section>

  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="closeModal('modal-medicao')">Cancelar</button>
    <button class="btn btn-primary" onclick="saveMedicao()">Salvar Medição</button>
  </div>
</div>
