<div class="modal-header">
  <span class="modal-title"><span class="material-symbols-outlined md-18" style="vertical-align:middle;margin-right:6px;">lock</span> Recurso bloqueado</span>
  <button class="modal-close" onclick="closeModal('modal-upgrade')"><span class="material-symbols-outlined md-18">close</span></button>
</div>

<div style="padding:20px 22px; text-align:center;">
  <div style="width:54px; height:54px; margin:0 auto 14px; border-radius:50%; background:rgba(255,107,53,.12); color:var(--accent); display:flex; align-items:center; justify-content:center;">
    <span class="material-symbols-outlined" style="font-size:28px;">lock</span>
  </div>
  <h3 id="upgrade-feature-name" style="font-size:17px; color:var(--text); margin-bottom:6px;">Recurso</h3>
  <p id="upgrade-feature-description" style="font-size:13px; color:var(--text2); line-height:1.6; margin-bottom:10px;"></p>
  <p style="font-size:12px; color:var(--muted); margin-bottom:20px;">Disponível a partir do plano <b id="upgrade-required-plan" style="color:var(--accent);">Pro</b>.</p>

  <div style="display:flex; flex-direction:column; gap:10px;">
    <button class="btn btn-primary" onclick="startKiwifyCheckout('start')" style="padding:12px; justify-content:center;">
      <span class="material-symbols-outlined md-18" style="vertical-align:middle;margin-right:6px;">rocket_launch</span> Start — R$ 69,90/mês
    </button>
    <button class="btn btn-primary" onclick="startKiwifyCheckout('pro')" style="padding:12px; justify-content:center; background:#10b981; border-color:#10b981;">
      <span class="material-symbols-outlined md-18" style="vertical-align:middle;margin-right:6px;">star</span> Pro — R$ 105,90/mês
    </button>
    <button class="btn btn-primary" onclick="startKiwifyCheckout('ilimitado')" style="padding:12px; justify-content:center; background:#0ea5e9; border-color:#0ea5e9;">
      <span class="material-symbols-outlined md-18" style="vertical-align:middle;margin-right:6px;">workspace_premium</span> Ilimitado — R$ 299,00/mês
    </button>
  </div>

  <p style="font-size:11px; color:var(--muted); margin-top:18px;">Seus dados permanecem preservados. O upgrade é processado com segurança pela Kiwify.</p>
</div>

<div class="modal-footer">
  <button class="btn btn-secondary" onclick="closeModal('modal-upgrade')">Agora não</button>
</div>
