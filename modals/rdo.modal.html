<!--
  ╔══════════════════════════════════════════════════════╗
  ║  ObraReal — Modal RDO (Relatório Diário de Obra)     ║
  ║  Arquivo: modals/rdo.modal.html                      ║
  ║  Dependência: js/rdo.module.js                       ║
  ╚══════════════════════════════════════════════════════╝

  COMO USAR EM app.html:
  Adicione no <head>:
    <script defer src="js/rdo.module.js?v=1"></script>

  Adicione na sidebar (grupo Produção):
    <div class="nav-item grp-prod" style="display:none" onclick="showPage('rdo')">
      <span class="ico">📋</span> <span>RDO</span>
    </div>

  O arquivo js/rdo.module.js registra a página automaticamente via window.registerPage().
-->

<style>
/* ── RDO Modal Styles ── */
.rdo-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 9990;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.rdo-modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 100%; max-width: 780px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 0;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.rdo-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--card); z-index: 2;
  border-radius: 14px 14px 0 0;
}
.rdo-modal-header h2 {
  font-size: 16px; font-weight: 700;
  color: var(--text); margin: 0;
  display: flex; align-items: center; gap: 8px;
}
.rdo-modal-header .rdo-actions {
  display: flex; gap: 8px; align-items: center;
}
.rdo-btn {
  padding: 7px 16px;
  border-radius: 7px; border: none;
  font-size: 13px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
}
.rdo-btn:hover { opacity: .85; }
.rdo-btn-save  { background: var(--accent); color: var(--accent-text); }
.rdo-btn-pdf   { background: #1D9E75; color: #fff; }
.rdo-btn-close { background: transparent; color: var(--text3); border: 1px solid var(--border); }

.rdo-body { padding: 20px 24px; }

.rdo-section {
  background: var(--bg2, var(--bg));
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 14px;
}
.rdo-section-title {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--text3); margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}

/* Grid layouts */
.rdo-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.rdo-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rdo-cargo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}
@media(max-width: 600px) {
  .rdo-grid-3 { grid-template-columns: 1fr 1fr; }
  .rdo-grid-2 { grid-template-columns: 1fr; }
}

/* Field */
.rdo-field { display: flex; flex-direction: column; gap: 4px; }
.rdo-field label {
  font-size: 11px; font-weight: 600;
  color: var(--text3);
}
.rdo-field input,
.rdo-field select,
.rdo-field textarea {
  font-size: 13px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--card);
  color: var(--text);
  font-family: inherit; width: 100%;
  transition: border-color .15s;
}
.rdo-field input:focus,
.rdo-field textarea:focus,
.rdo-field select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
}
.rdo-field textarea {
  resize: vertical; min-height: 90px; line-height: 1.55;
}

/* Cargo / Máquina items */
.rdo-counter-item {
  display: flex; align-items: center;
  justify-content: space-between;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  gap: 8px;
}
.rdo-counter-label {
  font-size: 12px; color: var(--text2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
}
.rdo-counter-input {
  width: 46px !important;
  text-align: center;
  font-weight: 700;
  font-size: 14px !important;
  padding: 3px 4px !important;
  border-radius: 6px;
}

/* Total badge */
.rdo-total {
  display: flex; align-items: center; gap: 8px;
  margin-top: 10px;
  font-size: 13px; color: var(--text3);
}
.rdo-total strong { font-size: 17px; color: var(--text); }

/* Chuva toggle */
.rdo-toggle-row { display: flex; gap: 8px; flex-wrap: wrap; }
.rdo-toggle {
  padding: 6px 16px; border-radius: 7px;
  border: 1px solid var(--border);
  font-size: 12px; font-weight: 600; cursor: pointer;
  background: var(--bg2, var(--bg)); color: var(--text3);
  transition: all .15s;
}
.rdo-toggle.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.rdo-chuva-detalhe {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin-top: 10px; align-items: flex-end;
}

/* Histórico list */
.rdo-hist-list { display: flex; flex-direction: column; gap: 6px; }
.rdo-hist-item {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 7px; background: var(--card);
  gap: 8px;
}
.rdo-hist-date { font-weight: 700; color: var(--text); min-width: 90px; }
.rdo-hist-info { color: var(--text3); flex: 1; }
.rdo-hist-btn {
  padding: 3px 10px; border-radius: 5px; border: 1px solid var(--border);
  font-size: 11px; background: transparent; color: var(--text3); cursor: pointer;
}
.rdo-hist-btn:hover { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

/* Tabs */
.rdo-tabs {
  display: flex; gap: 4px; margin-bottom: 16px;
  border-bottom: 1px solid var(--border); padding-bottom: 0;
}
.rdo-tab {
  padding: 8px 16px; font-size: 13px; font-weight: 600;
  border: none; background: none; cursor: pointer;
  color: var(--text3); border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: all .15s;
}
.rdo-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Print styles */
@media print {
  @page { margin: 1cm; size: auto; }
  body { background: #fff !important; color: #000 !important; }
  .rdo-modal-overlay { position: static !important; display: block !important; background: none !important; padding: 0 !important; }
  .rdo-modal { max-height: none !important; box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; overflow: visible !important; }
  .rdo-modal-header { position: static !important; border-bottom: 2px solid #000 !important; padding: 0 0 10px 0 !important; }
  .rdo-modal-header h2 { font-size: 20px !important; color: #000 !important; }
  .rdo-actions, .rdo-tabs, .rdo-tab, .rdo-btn-close { display: none !important; }
  .rdo-section { break-inside: avoid; border: 1px solid #ddd !important; background: #fff !important; margin-bottom: 20px !important; }
  .rdo-section-title { color: #000 !important; border-bottom: 1px solid #eee !important; padding-bottom: 5px !important; }
  body > *:not(.rdo-modal-overlay) { display: none !important; }
  
  /* Garantir que valores de input apareçam */
  input, select, textarea { border: none !important; background: transparent !important; padding: 0 !important; color: #000 !important; font-weight: bold !important; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
  .rdo-counter-item { border: 1px solid #eee !important; }

  /* Corrigir visibilidade de elementos específicos no RDO */
  .rdo-modal { display: block !important; visibility: visible !important; }
  .rdo-body { display: block !important; visibility: visible !important; }
  #rdo-aba-editor { display: block !important; visibility: visible !important; }
  
  /* Esconder botões de ação e abas */
  .rdo-actions, .rdo-tabs, .rdo-tab, .rdo-btn-close, .rdo-hist-btn { display: none !important; }
}
</style>

<!-- ═══════════════ MODAL HTML ═══════════════ -->
<div class="rdo-modal-overlay" id="rdo-overlay" style="display:none" onclick="rdoFecharSeFora(event)">
  <div class="rdo-modal" id="rdo-modal">

    <!-- Header -->
    <div class="rdo-modal-header">
      <h2>📋 Relatório Diário de Obra</h2>
      <div class="rdo-actions">
        <button class="rdo-btn rdo-btn-pdf" onclick="rdoGerarPDF()">🖨️ PDF</button>
        <button class="rdo-btn rdo-btn-save" onclick="rdoSalvar()">💾 Salvar</button>
        <button class="rdo-btn rdo-btn-close" onclick="rdoFechar()">✕</button>
      </div>
    </div>

    <!-- Tabs -->
    <div style="padding: 12px 24px 0">
      <div class="rdo-tabs">
        <button class="rdo-tab active" onclick="rdoAba('editor', this)">✏️ Novo RDO</button>
        <button class="rdo-tab" onclick="rdoAba('historico', this)">📅 Histórico</button>
      </div>
    </div>

    <!-- ── ABA: EDITOR ── -->
    <div class="rdo-body" id="rdo-aba-editor">

      <!-- Identificação -->
      <div class="rdo-section">
        <div class="rdo-section-title">🏗️ Identificação da obra</div>
        <div class="rdo-grid-3">
          <div class="rdo-field">
            <label>Empresa</label>
            <input id="rdo-empresa" type="text" placeholder="Nome da empresa">
          </div>
          <div class="rdo-field">
            <label>Obra</label>
            <input id="rdo-obra" type="text" placeholder="Nome da obra">
          </div>
          <div class="rdo-field">
            <label>Data</label>
            <input id="rdo-data" type="date">
          </div>
        </div>
        <div class="rdo-grid-2" style="margin-top:10px">
          <div class="rdo-field">
            <label>Responsável / Encarregado</label>
            <input id="rdo-responsavel" type="text" placeholder="Nome do responsável">
          </div>
          <div class="rdo-field">
            <label>Clima geral</label>
            <select id="rdo-clima">
              <option value="ensolarado">☀️ Ensolarado</option>
              <option value="nublado">⛅ Parcialmente nublado</option>
              <option value="chuva_tarde" selected>🌧️ Chuva à tarde</option>
              <option value="chuvoso">🌧️ Chuvoso</option>
              <option value="tempestade">⛈️ Tempestade</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Efetivo -->
      <div class="rdo-section">
        <div class="rdo-section-title">👷 Efetivo por cargo</div>
        <div class="rdo-cargo-grid" id="rdo-cargos-container"></div>
        <div class="rdo-total">
          Total de trabalhadores: <strong id="rdo-total-efetivo">0</strong>
        </div>
      </div>

      <!-- Máquinas -->
      <div class="rdo-section">
        <div class="rdo-section-title">🚜 Máquinas e equipamentos</div>
        <div class="rdo-cargo-grid" id="rdo-maquinas-container"></div>
      </div>

      <!-- Chuva -->
      <div class="rdo-section">
        <div class="rdo-section-title">🌧️ Período de chuva</div>
        <div class="rdo-toggle-row">
          <button class="rdo-toggle" id="rdo-tog-sem" onclick="rdoChuva('sem')">Sem chuva</button>
          <button class="rdo-toggle on"  id="rdo-tog-com" onclick="rdoChuva('com')">Houve chuva</button>
        </div>
        <div class="rdo-chuva-detalhe" id="rdo-chuva-detalhe">
          <div class="rdo-field">
            <label>Início</label>
            <input id="rdo-chuva-inicio" type="time" value="15:00" style="width:110px">
          </div>
          <span style="color:var(--text3);padding-bottom:4px">→</span>
          <div class="rdo-field">
            <label>Fim</label>
            <input id="rdo-chuva-fim" type="time" value="16:28" style="width:110px">
          </div>
          <div class="rdo-field" style="flex:1;min-width:150px">
            <label>Impacto</label>
            <select id="rdo-chuva-impacto">
              <option value="parcial" selected>Paralisação parcial</option>
              <option value="total">Paralisação total</option>
              <option value="nenhum">Sem paralisação</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Atividades -->
      <div class="rdo-section">
        <div class="rdo-section-title">📝 Atividades realizadas no dia</div>
        <div class="rdo-field">
          <textarea id="rdo-atividades" placeholder="Descreva as atividades do dia, uma por linha..."></textarea>
        </div>
      </div>

      <!-- Ocorrências -->
      <div class="rdo-section">
        <div class="rdo-section-title">⚠️ Ocorrências / Observações</div>
        <div class="rdo-field">
          <textarea id="rdo-ocorrencias" style="min-height:60px"
            placeholder="Acidentes, atrasos, falta de material, pendências..."></textarea>
        </div>
      </div>

      <!-- Assinaturas -->
      <div class="rdo-section">
        <div class="rdo-section-title">✍️ Assinaturas</div>
        <div class="rdo-grid-3">
          <div class="rdo-field"><label>Apontador</label><input id="rdo-ass-apontador" placeholder="Nome"></div>
          <div class="rdo-field"><label>Encarregado</label><input id="rdo-ass-encarregado" placeholder="Nome"></div>
          <div class="rdo-field"><label>Engenheiro / Fiscal</label><input id="rdo-ass-engenheiro" placeholder="Nome"></div>
        </div>
      </div>

    </div><!-- /rdo-aba-editor -->

    <!-- ── ABA: HISTÓRICO ── -->
    <div class="rdo-body" id="rdo-aba-historico" style="display:none">
      <div class="rdo-section">
        <div class="rdo-section-title">📅 RDOs salvos desta obra</div>
        <div class="rdo-hist-list" id="rdo-hist-lista">
          <div style="text-align:center;color:var(--text3);padding:24px;font-size:13px">
            Carregando histórico...
          </div>
        </div>
      </div>
    </div><!-- /rdo-aba-historico -->

  </div><!-- /rdo-modal -->
</div><!-- /rdo-overlay -->
